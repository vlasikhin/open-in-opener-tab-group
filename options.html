<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Open in Opener Tab Group</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; }
    label { display: block; margin: 6px 0; }
  </style>
</head>
<body>
  <p>When a tab group is left with one tab, ungroup it:</p>
  <label><input type="radio" name="autoUngroup" value="off"> Never</label>
  <label><input type="radio" name="autoUngroup" value="created"> Only groups created by this extension</label>
  <label><input type="radio" name="autoUngroup" value="all"> All groups</label>
  <script src="options.js"></script>
</body>
</html>
